<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link rel="stylesheet" href="/WTech_Spring25-26/Mid/JSValidation/Design/style.css">
</head>
<body>
    <header>
        <h1>Product Information</h1>
    </header>

    <main>
        <div class="container">
            <form>
                <fieldset>
                    <legend>Product Details</legend>

                    <p><strong>Unit Price: </strong>1000</p>

                    <label>Quantity: <label>
                    <input type="number" id="quantity" placeholder="Enter Quantity">
                    
                    <br><br>

                    <label>Total Price: </label>
                    <input type="number" id="totalPrice" value="0" readonly>
                </fieldset>
            </form>
        </div>

        <div class="button">
            <button id="btn">Calculate Total</button>
        </div>
    </main>

    <footer>
        <h3>Created 2026</h3>
    </footer>
    <script src="/WTech_Spring25-26/Mid/JSValidation/Javascript/script.js"></script>
</body>
</html>
