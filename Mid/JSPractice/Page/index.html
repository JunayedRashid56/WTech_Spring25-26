<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My E-commerce Site</title>
    <link rel="stylesheet" href="/Mid/JSPractice/Design/style.css">
</head>
<body>
    <header>
        <h1>My E-commerce Site</h1>
    </header>

    <main>
        <div class="container">
            <fieldset class="cart-section">

                <legend>Add to Cart</legend>
                <div class="product-info">
                    <p><strong>Product: </strong>Wireless Mouse</p>
                    <p><strong>Unit Price: </strong>500 Tk</p>
                </div>
                <div class="form-group">
                    <label for="quantity">Quantity: </label>
                    <input type="number" id="quantity" value="1" min="1">
                </div>
                <div class="form-group">
                    <p><strong>Total Price: </strong><span id="totalPrice">500</span> Tk</p>
                </div>
                <p id="couponMessage" class="coupon-message"></p>
                
            </fieldset>

            <fieldset class="checkout-section">
                <legend>Checkout</legend>
                <div class="form-group">
                    <label for="address">Shipping Address: </label>
                    <textarea id="address" rows="3" placeholder="Enter your full address"></textarea>
                </div>
                <div class="form-group">
                    <label for="delivery">Delivery Location: </label>
                    <select id="delivery">
                        <option value="inside">Inside Dhaka</option>
                        <option value="outside">Outside Dhaka</option>
                    </select>
                </div>
                <div class="form-group">
                    <p><strong>Delivery Charge: </strong><span id="deliveryCharge">50</span> Tk</p>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms">
                    <label for="terms">I agree to all the terms and conditions</label>
                </div>
                <button id="submitBtn" class="submit-btn" style="display: none;">Submit Order</button>
            </fieldset>
        </div>
    </main>
    
    <footer>
        <p>Copyright@2026</p>
    </footer>

    <script src="/Mid/JSPractice/Javascript/script.js"></script>
</body>
</html>
